name: Build RemoteTouch EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name RemoteTouch --collect-all PySide6 app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RemoteTouch-Windows
          path: dist/RemoteTouch.exe
